nerdfont: true
merge_strategy: rebase

status_icons:
  working: " "
  waiting: " "
  done: " "

agent: claude

panes:
  - command: <agent>
    focus: true

sidebar:
  templates:
    tiles:
      - "{primary} {pane_suffix} {fill} {elapsed}"
      - "{secondary} {fill} {git_stats}"
      - "{pane_title} {fill} {pr_number} {pr_checks}"

files:
  copy:
    - .env
