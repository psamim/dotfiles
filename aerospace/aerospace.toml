config-version = 2
start-at-login = true
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
automatically-unhide-macos-hidden-apps = true
on-focus-changed = ['exec-and-forget $HOME/.dotfiles/aerospace/mru-focus.sh record']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
cmd-f1 = 'workspace 1'
cmd-f2 = 'workspace 2'
cmd-f3 = 'workspace 3'
cmd-f4 = 'workspace 4'

alt-tab = 'exec-and-forget $HOME/.dotfiles/aerospace/mru-focus.sh next'
alt-shift-tab = 'exec-and-forget $HOME/.dotfiles/aerospace/mru-focus.sh prev'
alt-backtick = 'focus-back-and-forth'

ctrl-alt-o = 'fullscreen'
ctrl-alt-l = 'move-workspace-to-monitor --wrap-around next'

cmd-shift-f1 ='move-node-to-workspace 1'
cmd-shift-f2 = 'move-node-to-workspace 2'
cmd-shift-f3 = 'move-node-to-workspace 3'
cmd-shift-f4 = 'move-node-to-workspace 4'

# float everything
[[on-window-detected]]
check-further-callbacks = true
run = 'layout floating'

# 1: terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

# 2: browsers
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 2'

# 3: communication
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.kjgfgldnnfoeklkmfkjfagphfepbbdan'
run = 'move-node-to-workspace 3'

# 4: notes
[[on-window-detected]]
if.app-id = 'org.gnu.Emacs'
run = 'move-node-to-workspace 4'
